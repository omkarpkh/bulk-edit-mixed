<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bulk-edit — wireframe</title>
<style>
  body { margin:0; padding:26px; background:#f4f4f4; font:14px/1.5 ui-sans-serif, system-ui, sans-serif; color:#1a1a1a; }
  .wrap { max-width:1180px; margin:0 auto; }
  h1 { font-size:15px; font-weight:600; margin:0 0 3px; }
  .sub { font-size:12.5px; color:#777; margin:0 0 16px; }
  .switch { display:flex; gap:7px; margin-bottom:14px; }
  /* Harness, not product. These pick the fixture; they are not part of the thing
     being demonstrated, so they must not look like anything inside it. The pressed
     state used solid #1a1a1a, which is the component's own primary button. */
  .switch button { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; letter-spacing:.05em;
                   border:1px solid #e2e1da; background:transparent; color:#6e7077; padding:5px 10px; cursor:pointer; border-radius:2px; }
  .switch button:hover { color:#1a1a1a; border-color:#999; }
  .switch button[aria-pressed=true] { background:#fbeae8; color:#b7301f; border-color:#d4362c; }
  .count { font-size:12.5px; color:#777; align-self:center; margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>bulk-edit — wireframe</h1>
  <p class="sub">Every count, group and diff the component shows is computed by <code>model.js</code>.</p>

  <div class="switch">
    <button data-n="12" aria-pressed="false">12 hosts</button>
    <button data-n="200" aria-pressed="false">200 hosts</button>
    <button data-n="1847" aria-pressed="true">1,847 hosts</button>
    <button data-n="12000" aria-pressed="false">12,000 hosts</button>
    <span class="count"></span>
  </div>

  <bulk-edit></bulk-edit>
</div>

<script type="module">
import './../src/bulk-edit.js?v=1788349359';
// deterministic fixture — same input always gives the same screen
import { FIELDS, makeHosts } from './fixture.js';

const el = document.querySelector('bulk-edit');
// stand-in for a flaky backend: deterministic, so the same click fails the same way
el.failSimulator = scope => scope.filter((_, i) => i % 9 === 4).map(r => r.id);
const label = document.querySelector('.count');
function load(n) {
  const items = makeHosts(n);
  // arrive with a selection already made, the way an operator would
  const selected = items.slice(0, Math.min(200, items.length)).map(h => h.id);
  el.data = { items, fields: FIELDS, selected };
  label.textContent = `${n.toLocaleString()} hosts · ${new Set(items.map(h => h.environment)).size} environments`;
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.n === String(n)));
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => load(Number(b.dataset.n)));
load(1847);
</script>
</body>
</html>
