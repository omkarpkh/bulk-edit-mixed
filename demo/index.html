<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bulk-edit — wireframe</title>
<style>
  body { margin:0; padding:26px; background:#f4f4f4; font:14px/1.5 ui-sans-serif, system-ui, sans-serif; color:#1a1a1a; }
  .wrap { max-width:1180px; margin:0 auto; }
  h1 { font-size:15px; font-weight:600; margin:0 0 3px; }
  .sub { font-size:12.5px; color:#777; margin:0 0 16px; }
  .switch { display:flex; gap:7px; margin-bottom:14px; }
  .switch button { border:1px solid #c4c4c4; background:#fff; padding:6px 12px; font:inherit; cursor:pointer; }
  .switch button[aria-pressed=true] { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
  .count { font-size:12.5px; color:#777; align-self:center; margin-left:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>bulk-edit — wireframe</h1>
  <p class="sub">Every count, group and diff below is computed by <code>model.js</code>. Nothing on this page counts anything itself.</p>

  <div class="switch">
    <button data-n="12" aria-pressed="false">12 hosts</button>
    <button data-n="200" aria-pressed="false">200 hosts</button>
    <button data-n="1847" aria-pressed="true">1,847 hosts</button>
    <button data-n="12000" aria-pressed="false">12,000 hosts</button>
    <span class="count"></span>
  </div>

  <bulk-edit></bulk-edit>
</div>

<script type="module">
import './../src/bulk-edit.js?v=1788348030';

const FIELDS = [
  { key:'environment',   label:'Environment',   type:'single-select', options:['prod','staging','dev'] },
  { key:'tags',          label:'Tags',          type:'multi-value' },
  { key:'monitoring',    label:'Monitoring',    type:'boolean' },
  { key:'retentionDays', label:'Log retention', type:'number', min:1, max:365, unit:'d' },
];

// deterministic fixture — same input always gives the same screen
const TAGS = ['web','api','db','cache','worker','queue','pci','legacy','gpu','monitored'];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function makeHosts(n) {
  const rand = mulberry(7);
  return Array.from({ length: n }, (_, i) => {
    const envRoll = rand();
    const environment = n === 12
      ? (i < 5 ? 'prod' : i < 9 ? 'staging' : 'dev')
      : (envRoll < 0.60 ? 'staging' : envRoll < 0.975 ? 'dev' : 'prod');
    const tagCount = 1 + Math.floor(rand() * 3);
    const tags = [...new Set(Array.from({ length: tagCount }, () => TAGS[Math.floor(rand() * TAGS.length)]))].sort();
    return {
      id: `h${i}`,
      hostname: `${environment}-${['api','db','web','cache','worker'][i % 5]}-${String(i).padStart(2,'0')}.internal`,
      environment, tags,
      monitoring: rand() > 0.35,
      retentionDays: [7, 14, 30, 90, 1][Math.floor(rand() * 5)],
    };
  });
}

const el = document.querySelector('bulk-edit');
// stand-in for a flaky backend: deterministic, so the same click fails the same way
el.failSimulator = scope => scope.filter((_, i) => i % 9 === 4).map(r => r.id);
const label = document.querySelector('.count');
function load(n) {
  const items = makeHosts(n);
  // arrive with a selection already made, the way an operator would
  const selected = items.slice(0, Math.min(200, items.length)).map(h => h.id);
  el.data = { items, fields: FIELDS, selected };
  label.textContent = `${n.toLocaleString()} hosts · ${new Set(items.map(h => h.environment)).size} environments`;
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.n === String(n)));
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => load(Number(b.dataset.n)));
load(1847);
</script>
</body>
</html>
